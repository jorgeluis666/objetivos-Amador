<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Amador | Acceso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<!-- Plantilla: scripts/protect-pages.js pone aqui el tablero cifrado. No lleva la clave ni su hash.
     Mismo diseno y azul que la pantalla de acceso de LR Suite y de los demas tableros de la agencia. -->
<style>
  :root { --accent: #2563eb; --accent-dark: #1d4ed8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; overflow: hidden; background: #0f172a; color: #0f172a; }
  .panel { width: 400px; max-width: 100%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    padding: 48px 44px; overflow-y: auto; background: #fff; }
  .inner { width: 100%; max-width: 312px; }
  .logo { display: block; width: 44px; height: 44px; margin-bottom: 20px; border-radius: 50%; object-fit: cover; }
  .brand { margin-bottom: 16px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .title { margin: 0 0 28px; font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; color: #0f172a; }
  .divider { width: 40px; height: 3px; margin-bottom: 36px; border-radius: 2px; background: var(--accent); }
  form { display: flex; flex-direction: column; gap: 12px; }
  input[type=password] { width: 100%; padding: 12px 16px; border: 1.5px solid #dce3ef; border-radius: 8px; outline: none; background: #e8f0fe;
    color: #0f172a; font: inherit; font-size: 14px; transition: border-color .15s; }
  input[type=password]::placeholder { color: #64748b; }
  input[type=password]:focus { border-color: var(--accent); }
  .remember { display: flex; align-items: center; gap: 8px; color: #475569; font-size: 13px; cursor: pointer; }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit;
    font-size: 14px; font-weight: 600; letter-spacing: .02em; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .error { min-height: 18px; margin-top: 12px; font-size: 12px; color: #dc2626; }
  /* El degradado es la capa de respaldo si la imagen falta o todavia no carga. */
  .bg { flex: 1; min-width: 0; background-color: #0f172a; background-image: linear-gradient(140deg, var(--accent) 0%, var(--accent-dark) 38%, #0f172a 100%);
    background-size: cover; background-position: center; filter: grayscale(20%); }
  @media (max-width: 768px) {
    .panel { width: 100%; padding: 32px 24px; }
    .inner { max-width: 360px; }
    .title { font-size: 30px; margin-bottom: 22px; }
    .divider { margin-bottom: 26px; }
    .bg { display: none; }
  }
  @media (max-height: 520px) {
    .panel { align-items: flex-start; padding: 24px; }
    .title { font-size: 26px; margin-bottom: 18px; }
    .divider { margin-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="panel">
  <div class="inner">
    <img class="logo" src="assets/logo-amador.jpg" alt="" width="44" height="44">
    <div class="brand">Lima Retail</div>
    <h1 class="title">Amador</h1>
    <div class="divider"></div>
    <form id="gate">
      <input id="gate-pass" type="password" aria-label="Contraseña" placeholder="Contraseña" autocomplete="current-password" required autofocus>
      <label class="remember"><input id="gate-remember" type="checkbox"> Recordar en este equipo</label>
      <button id="gate-submit" type="submit" disabled>Ingresar</button>
    </form>
    <div class="error" id="gate-msg" role="alert"></div>
  </div>
</div>
<div class="bg" id="gate-bg"></div>
<script>
(() => {
  // AES-256-GCM con clave PBKDF2-SHA256. Sin la clave correcta el descifrado falla: no hay nada que saltar.
  const PAYLOAD = __PAYLOAD__;
  // Se guarda la clave derivada (no la escrita) con la sal del build. La sal es fija por marca
  // (scripts/protect-pages.js): lo recordado sirve entre deploys y deja de servir cuando cambia la clave.
  const STORE_KEY = 'amador-gate-key';
  const form = document.getElementById('gate');
  const input = document.getElementById('gate-pass');
  const remember = document.getElementById('gate-remember');
  const submit = document.getElementById('gate-submit');
  const msg = document.getElementById('gate-msg');

  const fromB64 = text => Uint8Array.from(atob(text), char => char.charCodeAt(0));
  const toB64 = bytes => btoa(String.fromCharCode(...bytes));

  function readStored() {
    for (const store of [sessionStorage, localStorage]) {
      try {
        const saved = JSON.parse(store.getItem(STORE_KEY) || 'null');
        if (saved && saved.salt === PAYLOAD.salt && saved.key) return fromB64(saved.key);
      } catch (error) { /* almacenamiento bloqueado: se pide la clave */ }
    }
    return null;
  }

  function store(rawKey, persistent) {
    const value = JSON.stringify({ salt: PAYLOAD.salt, key: toB64(rawKey) });
    try { sessionStorage.setItem(STORE_KEY, value); } catch (error) { /* sin almacenamiento */ }
    try {
      if (persistent) localStorage.setItem(STORE_KEY, value);
      else localStorage.removeItem(STORE_KEY);
    } catch (error) { /* sin almacenamiento */ }
  }

  function forget() {
    for (const store of [sessionStorage, localStorage]) {
      try { store.removeItem(STORE_KEY); } catch (error) { /* sin almacenamiento */ }
    }
  }

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations },
      base,
      256
    );
    return new Uint8Array(bits);
  }

  async function decrypt(rawKey) {
    const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  // El fondo se aplica solo cuando termino de cargar; si falla queda el degradado.
  // Con una llave guardada no se pide: la imagen retrasaria el 'load' que espera la apertura automatica.
  if (!readStored()) {
    const background = new Image();
    background.onload = () => {
      const bg = document.getElementById('gate-bg');
      if (bg) bg.style.backgroundImage = "url('assets/login-bg.jpg')";
    };
    background.src = 'assets/login-bg.jpg';
  }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'Abre esta página con https:// para poder ingresar.';
    input.disabled = true;
    submit.disabled = true;
    return;
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    msg.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Verificando...';
    try {
      const rawKey = await deriveKey(input.value.trim());
      const html = await decrypt(rawKey);
      store(rawKey, remember.checked);
      show(html);
    } catch (error) {
      msg.textContent = 'Contraseña incorrecta';
      submit.disabled = false;
      submit.textContent = 'Ingresar';
      input.select();
    }
  });

  // El boton nace deshabilitado: mientras la pagina sigue bajando el tablero cifrado, Enter no envia el
  // formulario (recargaria la pagina y se perderia lo escrito). Se habilita cuando ya se escucha el submit.
  submit.disabled = false;

  // Con la clave recordada se abre solo, pero despues del load: un document.open() con el parser
  // todavia activo agrega el tablero debajo del formulario en vez de reemplazar la pagina.
  const saved = readStored();
  if (saved) {
    submit.disabled = true;
    submit.textContent = 'Abriendo...';
    const loaded = document.readyState === 'complete'
      ? Promise.resolve()
      : new Promise(resolve => window.addEventListener('load', resolve, { once: true }));
    Promise.all([decrypt(saved), loaded]).then(([html]) => show(html), () => {
      forget();
      submit.disabled = false;
      submit.textContent = 'Ingresar';
    });
  }
})();
</script>
</body>
</html>
